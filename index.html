<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of S Hari Sankar — software engineer building dependable systems, intelligent products, and production-ready AI."
    />
    <meta name="theme-color" content="#F6F4F4" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('portfolio-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : prefersDark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            theme === 'dark' ? '#171414' : '#F6F4F4',
          )
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@200..800&family=Caveat:wght@400..700&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Lobster&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Hari Sankar — Backend &amp; AI Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
