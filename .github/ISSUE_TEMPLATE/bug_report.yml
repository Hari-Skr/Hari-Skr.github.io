name: Bug report
description: Report a reproducible problem with the portfolio.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please provide enough detail to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior you expected and what happened instead.
      placeholder: I expected ... but ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that consistently shows the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Affected page or URL
      placeholder: https://hari-skr.github.io/...

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other

  - type: dropdown
    id: device
    attributes:
      label: Device category
      options:
        - Desktop
        - Mobile
        - Tablet

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or console errors
      description: Drag and drop screenshots or paste relevant error output here.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed sensitive information from screenshots and logs.
          required: true
